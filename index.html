<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Smart E-Commerce Store</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to Our Store</h2>
        <p>Buy Amazing Products Online</p>
    </section>

    <section class="products">

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Smart Watch</h3>
            <p>₹1999</p>
            <button onclick="addCart()">Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Headphones</h3>
            <p>₹1499</p>
            <button onclick="addCart()">Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Mobile Phone</h3>
            <p>₹15999</p>
            <button onclick="addCart()">Add to Cart</button>
        </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
